      oversized value, and rejects a non-str id.
    - A grants value that is a str, bytes or non-iterable fails boot naming
      the id.
  review_fixes:
    - MEDIUM - a clients value was never validated, so a None value (an
      unset env var) booted the role generic, without its subtractive
      override and with no error or log. _validate_client now requires a
      str matching _SAFE_SEGMENT and fails boot naming the id, not the value.
  follow_ups:
