pr1a:
  status: implemented
  branch: feat/library-first-1a-locator
  pr_url: https://github.com/nahuel893/agents-system/pull/68
  files_changed:
    - src/agents_system/harness/loader.py
    - tests/test_locator_folder.py
    - tests/test_locator_inline.py
  diff_lines_authored: 623
  diff_budget_note: >-
    Exceeds the ~240-260 estimate and the 400-line default budget; every
    added line maps to a task-named RED scenario, a required docstring
    (design.md D1's own code block), or a review-requested fix/test, none
    padded. Recommend size:exception for this slice rather than a further
    pre-split, since PR1a is already the smallest chain unit the tasks
    phase defined.
  review_fixes:
    - load_generic's abstract-role error interpolated the locator object
      (FolderLocator repr) instead of resolved.role_name — fixed.
    - resolve()'s client=+non-str-locator mypy narrowing relied on a bare
      assert (stripped by python -O) — replaced with a real raise.
    - Added resolve()-level abstract-FolderLocator rejection test,
      inline-to-inline cycle test, end-to-end resolve(InlineLocator) test
      (own tool + inherited base tools, and client= raising), and
      tightened the folder-locator client-raises assertion to check
      message content.
    - Removed AI attribution from the PR body.
  ci: 12/12 checks passed (both pushes)
pr1b:
  status: implemented
  branch: feat/library-first-1b-extends
  pr_url: https://github.com/nahuel893/agents-system/pull/70
  files_changed:
    - src/agents_system/harness/loader.py
    - tests/test_extends_fail_loud.py
    - tests/test_platform_tools_integration.py
    - tests/test_role_resolution_pinned.py
    - tests/test_untrusted_input_invariant.py
    - docs/platform/role.md
    - docs/platform_es/role.md
  diff_lines_authored: 591
  diff_budget_note: >-
    Exceeds the ~215 estimate and the 400-line default budget; the bulk is
    tests/test_extends_fail_loud.py (391 lines, 46 tests), which maps to
    the task-named D2 cases, spec scenarios and threat-matrix cases. Nothing
    was trimmed; recommend size:exception.
  deviations:
    - Relative extends values resolve against the declaring agent's own
      folder (current.path), not against root as design.md D2's code block
      shows; that code block contradicted its own worked example, and the
      owner/orchestrator resolved rule is child-folder-relative.
    - _importer_root_of was not added; an isinstance(current, FolderLocator)
      narrowing is used because the resolution base needs current.path too.
    - The importer root itself is rejected (strictly inside only).
    - load_override keeps its last-segment check inline (checked, never
      resolved; deployment manifests write roles/<name>).
    - The chain-walk wrap now appends the parent's underlying load error
      ("could not be loaded", then the cause) instead of "does not exist",
      so nested extends errors are not masked.
  follow_ups:
    - role.md/manifest.md/policy.md symlinks inside an accepted folder are
      still followed out of the importer root by _read_md.
    - Residual TOCTOU between the containment check and the read (closing
      it needs fd-based openat/O_NOFOLLOW reads).
    - FolderLocator.path is not validated to lie inside FolderLocator.root
      for the leaf (PR2 sets root=path.parent).
