# Pre-commit hooks for agents-system.
#
# WHAT THIS IS FOR, AND WHAT IT IS NOT
#
# These hooks catch mechanical problems at the moment they are introduced, so
# that neither CI minutes nor a human reviewer's attention is spent on them.
# Every comment a reviewer spends on trailing whitespace is a comment they did
# not spend on the business logic.
#
# This is a net, NOT a guarantee. `git commit --no-verify` bypasses all of it.
# CI is the layer that is not skippable -- though note that `main` currently
# has no branch protection, so CI does not block a merge either. Treat both as
# feedback and the reviewer as the actual gate, until branch protection is on.
#
# DELIBERATELY ABSENT
#
# - pytest. The integration jobs need live Postgres, and a slow hook trains
#   everyone to type --no-verify. Tests run in CI.
#
# - mypy. Measured here: 50s cold, 1.1s warm, with strict = true. Worse than
#   slow -- the hook only sees staged files while mypy needs the whole project
#   to be correct, so it would be slow AND wrong. It runs in CI over src/.
#
# REQUIREMENTS
#
# pre-commit >= 3.2.0. Several hooks below declare `minimum_pre_commit_version:
# 3.2.0`, and an older runner raises a hard ValidationError that stops the
# WHOLE config from loading -- not just those hooks. Debian 12 ships 3.0.4.
# The version this project resolves is fixed in uv.lock, which is why
# pre-commit is a declared dev dependency rather than something you install
# however you happen to have it.
#
# INSTALL (once per clone):
#
#     uv sync --group dev
#     uv run pre-commit install --allow-missing-config
#
# `--allow-missing-config` is NOT optional here. Git hooks live in the shared
# gitdir, so one install arms every worktree -- including branches that predate
# this file. Without the flag, committing on any such branch aborts with
# "No .pre-commit-config.yaml file was found".
#
# Run manually:   uv run pre-commit run --all-files
# Uninstall:      uv run pre-commit uninstall

# Merge commits run the `pre-merge-commit` hook, NOT `pre-commit`. Without this
# line only the pre-commit type is installed, so every conflict-resolution
# commit -- the exact event check-merge-conflict exists for, in a repo whose
# protocol is parallel worktrees merging main -- would go entirely unchecked.
default_install_hook_types: [pre-commit, pre-merge-commit]

repos:
  # ---------------------------------------------------------------- hygiene
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      # --- formatting: these REWRITE the file and then fail the commit.
      # The file they fixed is not the file you staged, so you `git add` again.
      #
      # Caveat worth knowing: with a PARTIALLY staged file (`git add -p`),
      # pre-commit stashes the unstaged hunks, and if reapplying them conflicts
      # with the auto-fix it rolls the fix back entirely. You then get a failed
      # commit with nothing changed on disk, reproducibly. Stage the whole file
      # when a fixer is involved.
      - id: trailing-whitespace
        # Two trailing spaces are a hard line break in Markdown.
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
        # .engram/ is machine-written: `engram sync` rewrites manifest.json
        # without a trailing newline every time. Of its 11 committed versions,
        # 10 end without one, and the single exception was stripped back by the
        # next sync. Without this exclude the hook re-adds the byte, the sync
        # removes it, forever, on a file no human authors -- exactly the
        # --no-verify spiral this config is written to avoid.
        exclude: '^\.engram/'
      - id: mixed-line-ending
        args: [--fix=lf]

      # --- syntax: does this file even parse?
      - id: check-yaml
      - id: check-toml
      - id: check-json

      # --- repo hygiene
      - id: check-added-large-files
        # Default 500KB, deliberately NOT raised.
        #
        # This hook inspects only files being ADDED (`git diff --staged
        # --diff-filter=A`), so already-tracked files are invisible to it at
        # any threshold. An earlier version of this config raised the limit to
        # 1MB "to leave room for uv.lock" -- which the hook can never see,
        # since uv.lock has been tracked for months. That raise bought nothing
        # and let a stray 500KB-1MB blob through.
        #
        # What it does catch is the real hazard: a new binary committed by
        # accident. This project pulls a 4.3GB BGE-M3 model and writes
        # .engram/chunks/*.gz, and a blob in history is effectively permanent.
      - id: check-merge-conflict
        # --assume-in-merge because the hook returns 0 immediately unless git
        # is mid-merge (it checks for MERGE_MSG plus MERGE_HEAD). Without the
        # flag it is a no-op on ordinary commits AND inert under
        # `run --all-files`, so a conflict marker committed after a resolution
        # -- a live failure mode with parallel worktrees -- sails through.
        args: [--assume-in-merge]
      - id: check-case-conflict
        # Filenames differing only in case break on macOS/Windows checkouts.

      # --- security
      - id: detect-private-key
        # KNOW WHAT THIS DOES AND DOES NOT CATCH.
        #
        # It matches PEM and SSH key headers -- BEGIN RSA/DSA/EC/OPENSSH/PGP
        # PRIVATE KEY, and PuTTY-User-Key-File. That is all. It does NOT catch
        # API tokens, bearer tokens, passwords, or connection strings.
        #
        # This is not hypothetical. While reviewing this very PR, an Outline
        # API token was found as a plain literal in scripts/upload_outline.py
        # and scripts/cleanup_outline_duplicates.py, public since 2026-05-28.
        # This hook ran over both files and passed, because a bearer token
        # looks nothing like a PEM header.
        #
        # So: real value against the key class it covers, and NO coverage for
        # the token class -- which is the one that actually leaked here. The
        # control for generic tokens is GitHub's
        # `secret_scanning_non_provider_patterns`, a repository setting, not a
        # hook. Enable it there; do not assume this covers it.
        #
        # A credential that reaches a remote is compromised the moment it
        # lands: deleting the commit does not un-leak it. Rotation is the only
        # remediation.

  # ------------------------------------------------------------------- ruff
  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Kept in step with the ruff that uv.lock resolves (0.15.9), NOT with
    # latest. pre-commit runs each hook in its own isolated environment, so
    # this rev alone decides which ruff runs here.
    #
    # `pre-commit autoupdate` moved this to 0.16.5 and the hook immediately
    # reported 199 errors on a tree CI passes clean, because 0.16 ships rules
    # 0.15 does not. A hook that rejects what CI accepts trains you to use
    # --no-verify.
    #
    # Note that pyproject declares FLOORS, not pins: `ruff>=0.8` in
    # optional-dependencies and `ruff>=0.15.9` in dependency-groups. The only
    # thing fixing a version is uv.lock, which CI installs via
    # `uv sync --group dev`. So `uv lock --upgrade` can move CI to 0.16.x while
    # this rev stays behind -- the same divergence, inverted. When you upgrade
    # ruff, bump this rev to match uv.lock and re-run `pre-commit run
    # --all-files` in the same change.
    rev: v0.15.9
    hooks:
      # `ruff-check` is the canonical id; the bare `ruff` id still resolves but
      # reports itself as "ruff (legacy alias)".
      - id: ruff-check
        # --fix so the hook repairs what it can. No --exit-non-zero-on-fix:
        # pre-commit already fails any run in which a hook modified a file, so
        # the flag changes nothing here.
        args: [--fix]
      # The tree was formatted in one format-only commit (ADR-002 H.28), so
      # the hook only ever touches what the change itself touched. CI runs
      # `ruff format --check .` to catch anyone who bypasses the hook.
      - id: ruff-format

# ---------------------------------------------------------------------------
# KNOWN GAPS -- filed, not silently ignored
#
# - `.claude/settings.json` has a PostToolUse hook running `uv run ruff --fix`
#   on every Python Write/Edit. For agent-authored code the file is already
#   rewritten before any diff is shown, and that ruff comes from uv.lock while
#   this one comes from an isolated env at the rev above. Two ruffs on the same
#   file is a divergence waiting to happen; see the rev note.
#
# - No `.gitattributes`, so `mixed-line-ending --fix=lf` cannot make LF
#   durable. The tree has zero CR bytes today, but on a `core.autocrlf=true`
#   clone the hook would rewrite and fail on every commit. `* text=auto eol=lf`
#   is the fix, and it belongs in its own change.
#
# - `.engram/` is not gitignored, so 13 generated .jsonl.gz blobs are tracked
#   and every sync adds more. The size hook will start blocking sync commits
#   once they cross the threshold. The real fix is deciding whether that
#   directory belongs in git at all -- out of scope here.
#
# - CI never runs pre-commit, so these hooks exist only as a local convenience.
#   One job running `pre-commit run --all-files` would make the set enforceable
#   and dissolve the rev-sync problem above.
#
# NOT ENABLED, ON PURPOSE
#
# bandit: static security analysis for Python. It would not have caught either
#   incident this repo has had -- an exposed port in docker-compose, and a
#   hardcoded bearer token. Add it when there is a code-level threat it
#   addresses.
# ---------------------------------------------------------------------------
