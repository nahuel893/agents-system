services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: badie
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d badie"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    # Redis 8 bundles the Query Engine (RediSearch) required by the
    # langgraph-checkpoint-redis checkpointer (D-014 S4). redis:7 lacks
    # FT.* commands and crashes app startup when the checkpointer is enabled.
    image: redis:8-alpine
    ports:
      - "6379:6379"

volumes:
  pgdata:
