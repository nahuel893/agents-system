name: CI

on:
  push:
    branches: [main]
  pull_request:

# One run per PR or per main push. A newer push to a PR cancels the stale run;
# runs on main are never cancelled, so every merged commit gets a full result.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --group dev

      # ADR-002 C.14: `TerminalPolicy.sandbox` is required and `_run_argv`
      # (the seam BOTH `use_term` and `command_tools` execute through) fails
      # closed without `bwrap` -- so every existing operator/command-tools
      # test in this job now runs sandboxed too, not only the dedicated
      # `sandbox-integration` job's tests below.
      - name: Install bubblewrap
        run: sudo apt-get update && sudo apt-get install -y bubblewrap

      # Ubuntu 24.04+ blocks the unprivileged user namespace bubblewrap
      # needs to build its sandbox (`kernel.apparmor_restrict_unprivileged_
      # userns=1` by default), which is exactly what `--unshare-net` (the
      # no-network default) triggers. This relaxes it for THIS ephemeral,
      # single-purpose runner only -- never applied on a real deployment
      # host, and orthogonal to the sandbox itself, which still enforces no
      # network/filesystem escape/env leak once it can start at all.
      - name: Allow bubblewrap to create user namespaces on this runner
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      - name: Type check
        run: uv run mypy src/

      # ADR-002 H.32: coverage is measured over this default unit suite only
      # -- the `-m 'not integration'` deselect in pyproject.toml still
      # applies, and the seven `integration`-marked jobs below need live
      # services this job does not have, so they do not contribute to this
      # number. The threshold (94, `--cov-fail-under=94`) is the floor of
      # the baseline measured when this gate was added (94.87%): ratchet it
      # up as coverage improves, never raise it above a freshly measured
      # baseline.
      - name: Test
        run: >
          uv run pytest
          --cov=agentsys
          --cov-report=term-missing
          --cov-report=xml
          --cov-report=html
          --cov-fail-under=94

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            coverage.xml
            htmlcov/
          retention-days: 14

  # The read-only database role is the layer that is supposed to hold even if
  # parameter validation and the Layer-2 interceptor both have bugs. Nothing
  # verified it: `addopts = "-m 'not integration'"` deselected
  # test_bi_readonly_engine_refuses_writes unconditionally, and no script
  # created the role at all, so the guarantee was prose plus a manual step.
  # This job provisions the role for real and then tries to write through it.
  #
  # Every report test in this job targets platform-owned `audit_event`, migrated
  # by "Apply migrations" below. Its pytest fixture seeds isolated rows through
  # `admin_engine`; the assertions execute only through `bi_readonly`, including
  # a direct-write refusal check. Portable sales-report behavior is covered by
  # the separate `demo-reports` job against its contract-conforming database.
  bi-readonly:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: acme
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d acme"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/acme
      BI_DATABASE_URL: postgresql+asyncpg://bi_readonly:ci-only-password@localhost:5432/acme
      ALLOW_INSECURE: "true"

    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --group dev

      - name: Apply migrations (Alembic-owned schema)
        run: uv run alembic upgrade head

      # Provisioned AFTER the tables exist: the GRANT SELECT ON ALL TABLES is
      # a snapshot of what exists when it runs, and ALTER DEFAULT PRIVILEGES
      # only covers tables created later.
      - name: Provision the bi_readonly role
        run: |
          psql "postgresql://postgres:postgres@localhost:5432/acme" \
            -v ON_ERROR_STOP=1 \
            -v bi_password="'ci-only-password'" \
            -f scripts/provision_bi_readonly.sql

      - name: Verify the role really is read-only
        run: uv run pytest -m integration tests/test_reports_integration.py -v

  # audit_event is RANGE partitioned, and partitioning is the one part of that
  # schema SQLAlchemy cannot express — the ORM model carries no partitions at
  # all. So no unit test can tell whether a row actually lands in a partition,
  # and SQLite cannot even compile the DDL. Only a real PostgreSQL round trip
  # can, which is what this job is for.
  #
  # It exists because of a specific failure mode the unit suite is blind to:
  # the migration creates a fixed number of monthly partitions, and without a
  # DEFAULT partition PostgreSQL rejects the first row past the last bound
  # ("no partition of relation ... found for row"). The audit log would stop
  # recording months after install, with no code change to blame.
  audit-migration:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: audit_migration_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d audit_migration_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # A throwaway database: these tests run `alembic upgrade head` and
      # `alembic downgrade base` for real.
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/audit_migration_test
      AUDIT_TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/audit_migration_test
      ALLOW_INSECURE: "true"

    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --group dev

      # No schema setup step: the tests own the full upgrade/downgrade cycle,
      # so anything created here would just be state they did not expect.
      - name: Verify the partitioned audit schema
        run: uv run pytest -m integration tests/test_audit_migration_integration.py -v

  # The portable sales reports are the platform's claim that one report
  # catalog serves every client. That claim is only worth what proves it: a
  # company whose tables are called `facturas` / `padron_clientes`, whose
  # statuses are `facturada` / `anulada`, and whose lines carry no total —
  # with the reports running against it unchanged.
  #
  # `tests/test_sales_reports_contract.py` runs in the main job and is static
  # (the SQL names only contract views). It cannot see a status mapping that
  # drops a value or a computed line total that disagrees with the invoice
  # header: both produce confidently wrong numbers and no error. This job is
  # where those die, so the integration marker is not left as coverage nobody
  # runs.
  demo-reports:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: agentsys_demo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d agentsys_demo"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DEMO_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/agentsys_demo
      ALLOW_INSECURE: "true"

    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --group dev

      # The test module loads the demo company itself, so this step exists
      # only to fail loudly and early if the loader or the view contract is
      # broken — otherwise that surfaces as a pytest skip, which reads as
      # "passed".
      - name: Load the demo company and verify the view contract
        run: uv run python demo/load_demo_company.py

      - name: Run the portable reports against it
        run: uv run pytest -m integration tests/test_sales_reports_integration.py -v

  # test_db_integration.py was collected by no CI job at all (issue #42): the
  # `integration` marker made `addopts = "-m 'not integration'"` deselect it
  # everywhere, and nothing re-ran it with the marker re-enabled. It asserts
  # end-to-end connectivity through get_session_factory/get_db against a real
  # Postgres, so it needs a live database, just not any particular schema.
  db-integration:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: agentsys
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d agentsys"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/agentsys
      ALLOW_INSECURE: "true"

    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --group dev

      - name: Verify database connectivity end-to-end
        run: uv run pytest -m integration tests/test_db_integration.py -v

  # test_embeddings_integration.py was also collected by no CI job (issue
  # #42). Unlike the OpenAI-compatible provider below, BAAI/bge-m3 is a free,
  # public model download — no paid API, no secret, no rate limit — so there
  # is no reason to stand in for it: this job runs it for real. `torch` and
  # `sentence-transformers` are already core dependencies (see pyproject.toml
  # and main.py's lifespan comment on why the import is lazy elsewhere), so
  # no extra install step is needed. The cache step just avoids re-downloading
  # the model on every run.
  embeddings-integration:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --group dev

      - name: Cache the BGE-M3 model weights
        uses: actions/cache@v6
        with:
          path: ~/.cache/huggingface
          key: bge-m3-${{ runner.os }}

      - name: Run the real local embedding provider
        run: uv run pytest -m integration tests/test_embeddings_integration.py -v

  # test_openai_compatible_integration.py was also collected by no CI job
  # (issue #42). It is verified against MiniMax in production, but MiniMax is
  # a paid, rate-limited remote service (see the test file's docstring) — not
  # something CI should depend on or need a secret for. What actually needs
  # proving here is `ReasoningSanitizedChatOpenAI`: that it strips a leading
  # <think> block from a REAL HTTP response without disturbing tool_calls.
  # That only needs an OpenAI-compatible endpoint, not MiniMax specifically,
  # so this job stands one up locally (scripts/fake_openai_compatible_server.py)
  # and points the tests at it — a real round trip, against a local stand-in
  # for the paid remote one.
  openai-compatible-integration:
    runs-on: ubuntu-latest

    env:
      OPENAI_COMPATIBLE_BASE_URL: http://127.0.0.1:8811/v1
      OPENAI_COMPATIBLE_MODEL: fake-integration-model
      OPENAI_COMPATIBLE_API_KEY: fake-key-not-checked
      ALLOW_INSECURE: "true"

    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --group dev

      - name: Verify the reasoning sanitizer against the local stand-in
        run: |
          uv run python scripts/fake_openai_compatible_server.py --port 8811 &
          server_pid=$!
          trap "kill $server_pid 2>/dev/null || true" EXIT

          for _ in $(seq 1 20); do
            curl -sf http://127.0.0.1:8811/health > /dev/null && break
            sleep 0.5
          done

          uv run pytest -m integration tests/test_openai_compatible_integration.py -v

  # test_outbox_migration_integration.py (added by #131, tracked alongside
  # #42) was also collected by no CI job. It runs `alembic upgrade head` and
  # then `alembic downgrade base` / `downgrade 001` for real against
  # OUTBOX_TEST_DATABASE_URL, so — like audit-migration above — it needs its
  # own disposable database and no schema setup step: the tests own the full
  # migration cycle themselves, and this job's Postgres service container
  # exists for no other purpose, so nothing else can collide with the
  # downgrade dropping tables.
  outbox-migration:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: outbox_migration_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d outbox_migration_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      OUTBOX_TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/outbox_migration_test
      ALLOW_INSECURE: "true"

    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --group dev

      - name: Verify the durable inbox/outbox migration
        run: uv run pytest -m integration tests/test_outbox_migration_integration.py -v

  # ADR-002 C.14 — tests/test_sandbox_integration.py needs a REAL `bwrap` and
  # actually spawns sandboxed subprocesses (network probes, filesystem-escape
  # attempts, a memory-limit breach, a killed-at-timeout hang), so it is
  # `integration`-marked like every other job on this page and gets its own
  # job rather than relying on the main `ci` job's install step alone -- a
  # missing or broken sandbox here fails loudly, never a silent skip.
  sandbox-integration:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --group dev

      - name: Install bubblewrap
        run: sudo apt-get update && sudo apt-get install -y bubblewrap

      # See the same step in the `ci` job above for why this is needed and
      # why it is safe: an ephemeral runner-only relaxation, not a change to
      # what the sandbox itself allows once it can start.
      - name: Allow bubblewrap to create user namespaces on this runner
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true

      - name: Verify the bubblewrap sandbox for real
        run: uv run pytest -m integration tests/test_sandbox_integration.py -v

  # ADR-002 H.33: `.claude/hooks/guard-main.sh` (#99) is a security control
  # written in bash. Its BEHAVIOUR is covered by tests/test_guard_main_hook.py
  # (46 tests, runs in the `ci` job above), but nothing checked the SCRIPT
  # itself for the failure modes bash allows silently -- unquoted expansion,
  # word splitting -- until now. `scripts/preflight_local_embeddings.sh` had
  # no check at all. `git ls-files -- '*.sh'` means a new tracked script is
  # covered automatically, with no list to remember to update here.
  shellcheck:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Pinned to an exact shellcheck release instead of the runner image's
      # apt package (version not otherwise controlled by us) or an unpinned
      # third-party Action.
      - name: Install shellcheck
        env:
          SHELLCHECK_VERSION: "0.11.0"
        run: |
          curl -sSfL "https://github.com/koalaman/shellcheck/releases/download/v${SHELLCHECK_VERSION}/shellcheck-v${SHELLCHECK_VERSION}.linux.x86_64.tar.gz" -o /tmp/shellcheck.tar.gz
          tar -xzf /tmp/shellcheck.tar.gz -C /tmp
          sudo mv "/tmp/shellcheck-v${SHELLCHECK_VERSION}/shellcheck" /usr/local/bin/shellcheck
          shellcheck --version

      - name: shellcheck every tracked shell script
        run: git ls-files -z -- '*.sh' | xargs -0 shellcheck

  # ADR-002 H.29: nothing checked whether a dependency has a known
  # vulnerability. `pip-audit` (or the `uv` equivalent, once its own native
  # audit is stable) runs against exactly what `uv sync --group dev` just
  # installed and fails the build on any known vulnerability that is not on
  # the explicit, commented ignore list below.
  #
  # pip-audit is intentionally NOT a project/dev dependency: `uv run --with
  # pip-audit pip-audit --local` audits an EMPTY ephemeral overlay (0
  # packages -- verified locally), not this project's environment, because
  # `--with` builds a throwaway env containing only pip-audit's own deps.
  # `pip-audit -r <requirements.txt>` fails too: it re-resolves every pin
  # through a real `pip install --dry-run`, which breaks on the CPU-only
  # `torch==...+cpu` build (`[tool.uv.sources]`, the `pytorch-cpu` index) --
  # pip has no way to find that exact local-version build on plain PyPI.
  # Installing pip-audit straight into .venv with `uv pip install`, then
  # calling the binary directly, is the only combination that audits what
  # was actually just installed.
  dependency-audit:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --group dev

      - name: Install pip-audit
        run: uv pip install pip-audit==2.10.1

      # Baseline established 2026-09-23 (issue #115). pip-audit found 35
      # known vulnerabilities across 17 packages. Seven were trivial, safe
      # bumps -- anyio, click, idna, pydantic-settings, pyjwt, pytest,
      # urllib3 -- all resolved within pyproject.toml's EXISTING constraints
      # (no pin changed) via `uv lock -P <pkg>`, with the full unit suite
      # verified green afterward; those are gone from uv.lock, not ignored
      # here. The 22 that remain each need real migration work, not a
      # lockfile edit -- every one is tracked by its own follow-up issue,
      # cited below, and an entry may only be removed by closing or
      # narrowing the issue it cites (never silently, and never because the
      # build was red).
      - name: Audit the locked dependency set for known vulnerabilities
        run: |
          IGNORE_VULNS=(
            # langchain-anthropic, langchain-core, langchain-openai,
            # langgraph, langgraph-checkpoint, langgraph-sdk, langsmith --
            # pyproject.toml pins langgraph/langchain-openai/langchain-
            # anthropic to <1.0, but several of these CVEs (langchain-core's
            # PYSEC-2026-2562 and PYSEC-2026-2193 in particular) have no fix
            # backported to the 0.x line -- closing them means moving the
            # whole interdependent ecosystem to its 1.x line together, a
            # real migration. Tracked in #151.
            --ignore-vuln PYSEC-2026-2556
            --ignore-vuln PYSEC-2026-2562
            --ignore-vuln PYSEC-2026-2563
            --ignore-vuln PYSEC-2026-2564
            --ignore-vuln PYSEC-2026-2193
            --ignore-vuln PYSEC-2026-76
            --ignore-vuln PYSEC-2026-83
            --ignore-vuln PYSEC-2026-2574
            --ignore-vuln PYSEC-2026-2573
            --ignore-vuln PYSEC-2026-2194
            --ignore-vuln PYSEC-2026-2575
            --ignore-vuln PYSEC-2026-2583
            --ignore-vuln PYSEC-2026-2555
            --ignore-vuln PYSEC-2026-2582
            --ignore-vuln CVE-2026-59152

            # starlette -- transitive via fastapi>=0.115,<1.0. Fully closing
            # this needs starlette >=1.3.1; whether that resolves cleanly
            # against the pinned fastapi range is unverified, and fastapi
            # may need bumping too. Tracked in #152.
            --ignore-vuln PYSEC-2026-161
            --ignore-vuln PYSEC-2026-2281
            --ignore-vuln PYSEC-2026-2280
            --ignore-vuln PYSEC-2026-249
            --ignore-vuln PYSEC-2026-248

            # transformers -- transitive via sentence-transformers>=3.0. A
            # minor-version bump of a large, actively-changing ML dependency
            # deserves its own verification pass against the real
            # BAAI/bge-m3 embedding path, not a drive-by lockfile edit.
            # Tracked in #153.
            --ignore-vuln PYSEC-2026-3929

            # setuptools -- `uv tree --invert --package setuptools` shows
            # the sole constraint is torch's own metadata (both directly and
            # via sentence-transformers); it will not move until a newer
            # CPU-index torch build allows a higher setuptools. Tracked in
            # #154.
            --ignore-vuln PYSEC-2026-3447
          )

          # GitHub Actions runs `run:` steps as `bash -e ... {0}` by default,
          # so `AUDIT_EXIT=$?` on its own line would never execute when
          # pip-audit exits non-zero -- set -e aborts the script at the
          # failing command first, and the diagnostic below (and the exit
          # code it explains) would silently never print. The `&& ... || ...`
          # form assigns AUDIT_EXIT either way without tripping set -e.
          .venv/bin/pip-audit --local --progress-spinner off -f json -o pip-audit-report.json "${IGNORE_VULNS[@]}" && AUDIT_EXIT=0 || AUDIT_EXIT=$?

          .venv/bin/python -c "
          import json
          data = json.load(open('pip-audit-report.json'))
          deps = data.get('dependencies', [])
          flagged = [d for d in deps if d.get('vulns')]
          print(f'pip-audit: {len(deps)} packages audited, {len(flagged)} still flagged after the baseline ignore list.')
          for d in flagged:
              ids = ', '.join(v['id'] for v in d['vulns'])
              print(f'  UNEXPECTED (not on the baseline list): {d[\"name\"]} {d[\"version\"]} -> {ids}')
          "

          exit "$AUDIT_EXIT"

      - name: Upload pip-audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pip-audit-report
          path: pip-audit-report.json
          retention-days: 14

  # ADR-002 H.30: `detect-private-key` (.pre-commit-config.yaml) only catches
  # PEM/SSH key headers, runs only where pre-commit is installed, is
  # skippable with --no-verify, and never looks at history. This job runs on
  # BOTH triggers this workflow has (`on: push` to main, `on: pull_request`),
  # deliberately not gated to `pull_request` only: branch protection cannot
  # require a PR on this repo today (the GitHub API 403s enabling it on a
  # private repo on the free plan), so a direct push straight to `main`
  # remains possible and must still be scanned, not just PR-authored commits.
  #
  # - On `pull_request`, gitleaks-action reads the PR's own commit list from
  #   the GitHub API and scans exactly `baseRef^..headRef` (src/gitleaks.js,
  #   ScanPullRequest) -- the PR's commits, not the whole repo.
  # - On `push`, it scans exactly the commits the push introduced instead
  #   (src/index.js: `baseRef`/`headRef` come from the push event's own
  #   `commits[]` array, first to last -- a single commit if the push was
  #   just one).
  #
  # Either way `fetch-depth: 0` is required: those commits must actually be
  # present locally for `git log` to walk them.
  #
  # Pinned to major version 3, not 2: v2 is a Node 20 action, and GitHub
  # removed Node 20 from hosted runners on 2026-09-16 (gitleaks-action's own
  # README) -- v2 no longer runs at all as of that date.
  secret-scan:
    runs-on: ubuntu-latest

    # gitleaks-action calls `GET /repos/{owner}/{repo}/pulls/{n}/commits` on
    # a `pull_request` event to get the PR's own commit range (see the job
    # comment above) -- that call needs `pull-requests: read`, not just
    # `contents: read`; without it the API returns 403 "Resource not
    # accessible by integration" and the job fails before it scans anything
    # (observed on PR #155's first run). Not needed on `push`, but harmless
    # to keep declared for both.
    permissions:
      contents: read
      pull-requests: read

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
