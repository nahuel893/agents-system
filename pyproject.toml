[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agents-system"
version = "0.2.0"
description = "Reusable AI agent platform library: a generic harness and platform agent roles that a client application equips with its own tools and deployment overrides"
readme = "README.md"
license = "MIT"
authors = [
    { name = "nahuel893", email = "63928063+nahuel893@users.noreply.github.com" },
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.53.0",
    "langgraph>=0.2,<1.0",
    "langgraph-checkpoint-redis>=0.1",
    "langchain-anthropic>=0.3,<1.0",
    "langchain-openai>=0.3,<1.0",
    "sqlalchemy[asyncio]>=2.0.54,<3.0",
    "asyncpg>=0.30",
    "redis>=5.0,<6.0",
    "httpx>=0.28",
    "pydantic-settings>=2.0,<3.0",
    "structlog>=24.0",
    "phonenumbers>=8.13",
    "openai>=1.50",
    "torch>=2.0,<3.0",
    "sentence-transformers>=3.0",
    "python-dotenv>=1.2.2",
    "langchain-groq>=0.3.8",
    "langchain-ollama>=0.3.10",
    "alembic>=1.13",
    "prometheus-client>=0.20,<1.0",
    "sqlglot>=30.19,<31",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "mypy>=1.13",
]

[project.urls]
Homepage = "https://github.com/nahuel893/agents-system"
Repository = "https://github.com/nahuel893/agents-system"

[tool.hatch.build.targets.wheel]
packages = ["src/agents_system"]

# Ship the generic platform roles (platform/roles/**) inside the wheel so
# `agents_system.harness.loader.resolve()` works after a plain `pip install`.
# Target is `agents_system/platform` — two `.parent` hops up from loader.py,
# matching `_PACKAGED_PLATFORM_ROOT` in src/agents_system/harness/loader.py.
# deployments/ is NOT included: a client's deployments are the client's own.
[tool.hatch.build.targets.wheel.force-include]
"platform" = "agents_system/platform"

# Restrict the sdist to what a library needs to build and be understood:
# source, the platform roles that force-include ships into the wheel, and
# the top-level docs a package index renders. Everything else (deployments/,
# demo/, docs/, evals/, scripts/, .env.example, internal tooling) stays out
# of the published archive.
[tool.hatch.build.targets.sdist]
include = [
    "/src/agents_system",
    "/platform",
    "/README.md",
    "/LICENSE",
    "/pyproject.toml",
]

[tool.ruff]
src = ["src"]
target-version = "py312"

[tool.ruff.lint]
ignore = [
    # FastAPI's `Depends(...)` in a parameter default is the framework's own
    # dependency-injection idiom, not an accidental eager call.
    "B008",
    # This codebase's error-boundary layers (webhook worker, health probes,
    # RAG fallback, audit sink) deliberately catch `Exception` broadly and
    # log-and-continue/log-and-degrade by design, so a crash in one turn/probe
    # never takes down the process; narrowing each site would fight the design.
    "BLE001",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: requires real models / external services (slow, opt-in)",
    "live: live-eval pipeline against a real local model (#169, ADR-002 E.18; manual/nightly, opt-in)",
]
# Skip integration and live tests by default (they need models, a GPU, or a
# live DB). Run them explicitly with: pytest -m integration / pytest -m live
#
# This deselection is UNCONDITIONAL, which is fine for slow opt-in tests and
# was NOT fine for one of them: test_bi_readonly_engine_refuses_writes is the
# only automated check that the BI role is actually read-only — the layer
# meant to hold even if validation and the interceptor both have bugs — and
# nothing ever ran it. It now runs in the `bi-readonly` CI job, which
# provisions the role with scripts/provision_bi_readonly.sql and then tries
# to write through it. If you add another integration test that guarantees a
# security property, add it to that job too; a marker is not coverage.
#
# `live` is deliberately never added to a CI job (ADR-002 E.18): it calls a
# real local Ollama model, which is slow, non-deterministic, and unavailable
# in CI — it runs manually or nightly against a developer's own Ollama.
addopts = "-m 'not integration and not live'"

[tool.mypy]
python_version = "3.12"
strict = true

[[tool.mypy.overrides]]
module = [
    "asyncpg",
    "asyncpg.*",
    "sentence_transformers.*",
    "yaml",
]
ignore_missing_imports = true

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.16.8",
    "mypy>=1.13",
    "pre-commit>=3.2",
    "aiosqlite>=0.20",
    "pytest-cov>=7.1.0",
]

# Force CPU-only torch (avoid pulling 5GB of CUDA libs on machines without GPU)
[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]
torchvision = [{ index = "pytorch-cpu" }]
torchaudio = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
