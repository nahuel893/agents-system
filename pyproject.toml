[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "badie"
version = "0.1.0"
description = "WhatsApp Sales Agent powered by LangGraph"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.34",
    "langgraph>=0.2,<1.0",
    "langgraph-checkpoint-redis>=0.1",
    "langchain-anthropic>=0.3,<1.0",
    "langchain-openai>=0.3,<1.0",
    "sqlalchemy[asyncio]>=2.0,<3.0",
    "asyncpg>=0.30",
    "pgvector>=0.3",
    "redis>=5.0,<6.0",
    "httpx>=0.28",
    "pydantic-settings>=2.0,<3.0",
    "structlog>=24.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "mypy>=1.13",
]

[tool.hatch.build.targets.wheel]
packages = ["src/badie"]

[tool.ruff]
src = ["src"]
target-version = "py312"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
strict = true

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.15.9",
]
