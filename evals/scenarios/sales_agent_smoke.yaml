# Smoke scenario for the live-eval pipeline (#169, ADR-002 E.18).
#
# Proves resolve() -> build_runtime() -> AgentRuntime.run_turn works end to
# end against a real local model. This is NOT a correctness suite for
# sales-agent -- per-role scenario coverage is deliberately out of scope for
# #169 (sibling issues own it). See docs/platform/live-eval.md for the
# scenario schema and how to run this with `pytest -m live`.
#
# category/threshold (#81): happy-path, but with a deliberately lenient
# override -- the default local model this test runs against (`qwen2.5:3b`,
# `tests/test_live_eval_sales_agent.py`'s own documented floor/regression
# case) is too small for reliable tool-calling. The default 80% threshold
# would make this pipeline smoke test flaky against its own documented
# floor model; 20% still catches a genuine total pipeline break (0/5) while
# tolerating the accepted floor-model noise. Point EVAL_PROVIDER at a real
# hosted model (see docs/platform/live-eval.md) for a meaningful rate.
role: sales-agent
category: happy_path
threshold: 0.2
threshold_reason: >
  Pipeline smoke test against the deliberately weak default local model
  (qwen2.5:3b) -- a low rate here is an accepted, documented floor case, not
  a policy failure. See this file's own header comment.
description: >
  A customer asks whether a catalog item is in stock and what it costs. A
  competent sales-agent looks it up with catalog_search instead of guessing,
  and this single inquiry gives it no reason to write an order or escalate.
turns:
  - "Hi, do you have Item Alpha in stock and how much does it cost?"
assertions:
  tools_called: [catalog_search]
  tools_not_called: [order_writer, escalation_notifier]
  escalation_expected: false
