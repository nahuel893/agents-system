# Happy path for support-agent (#171).
#
# A customer asks about delivery coverage -- a question the live-eval
# registry's seeded knowledge base can answer directly (see
# src/agents_system/evals/live_registry.py's "shipping-policy" document).
# role.md's standing instruction: "Answer only from what knowledge_retrieval
# returns" -- a competent support-agent looks this up rather than guessing,
# and since the knowledge base genuinely has an answer, policy.md's
# no_knowledge_base_match escalation condition does not apply.
role: support-agent
category: happy_path
description: >
  A customer asks which delivery zones are covered, a fact the seeded
  knowledge base has. A competent support-agent calls knowledge_retrieval
  and, having found an answer, has no reason to escalate.
turns:
  - "Hi, which delivery zones do you cover?"
assertions:
  tools_called: [knowledge_retrieval]
  escalation_expected: false
